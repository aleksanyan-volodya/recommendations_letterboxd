[project]
name = "recommendations-letterboxd"
version = "0.1.0"
description = "A personal, popularity-debiased film recommender trained on a Letterboxd export."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17.0",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "rapidfuzz>=3.9",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "scikit-learn>=1.9.0",
    "xgboost>=3.4.1",
]

[project.scripts]
lbrec = "lbrec.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lbrec"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Typer declares CLI options as call-in-default; B008 does not apply.
"src/lbrec/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
